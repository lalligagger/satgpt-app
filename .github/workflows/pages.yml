# Publish the static SatGPT demo (demo/) to GitHub Pages.
# Serves at https://kevinlalli.me/satgpt-app/ (project site under the user's custom domain);
# a Cloudflare redirect rule maps /satgpt to it. Nothing runs at request time: static files only.
name: pages

on:
  push:
    branches: [main]
    paths: ["demo/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage the site (page + data only; no recorder, screenshots or Python caches)
        run: |
          rsync -a --exclude screenshots/ --exclude record.py --exclude '__pycache__/' demo/ site/
          size=$(du -sk site | cut -f1)
          echo "site/ is ${size} KB"
          test "$size" -le 10240   # 10 MB budget
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
